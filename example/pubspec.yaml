name: self_test_example
description: Example app for self_test package
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

# Declared exactly as a real consumer would, with the paths supplied by
# dependency_overrides below. That keeps this pubspec usable as the quickstart
# reference instead of a monorepo special case.
dependencies:
  flutter:
    sdk: flutter
  self_test: ^0.2.0

dev_dependencies:
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  self_test_gen: ^0.2.0
