name: self_test
description: "Automated regression testing for Flutter through direct callback invocation. Run tests in live app environments without UI simulation."
version: 0.1.0
repository: https://github.com/loonix/self_test
issue_tracker: https://github.com/loonix/self_test/issues
topics:
  - testing
  - flutter
  - regression
  - automation

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  build: ^2.4.0
  flutter:
    sdk: flutter
  meta: ^1.0.0
  source_gen: ^1.5.0
  analyzer: ^6.0.0
  dart_style: ^2.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
