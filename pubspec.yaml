name: self_test
description: "Automated regression testing for Flutter through direct callback invocation. Run tests in live app environments without UI simulation."
version: 0.2.0
repository: https://github.com/loonix/self_test
issue_tracker: https://github.com/loonix/self_test/issues
topics:
  - testing
  - flutter
  - regression
  - automation

# Verified floor, not an aspiration. Flutter 3.35.0 / Dart 3.9.0 is the
# oldest pair on which this package analyzes clean and its tests pass, and
# CI runs the whole suite against it on every push so the claim stays true.
# It used to say >=3.24.0 while lib/recording_fields wrapped widget
# properties that only exist from 3.35 (Switch.activeThumbColor and
# friends), so a consumer on 3.24 got eight compile errors inside the
# package they had just installed.
environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
