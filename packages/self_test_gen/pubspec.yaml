name: self_test_gen
description: "build_runner code generator for self_test. Turns @SelfTestButton and @SelfTestInput annotations into a typed test controller."
version: 0.2.0
repository: https://github.com/loonix/self_test
issue_tracker: https://github.com/loonix/self_test/issues
topics:
  - testing
  - flutter
  - codegen
  - build-runner

environment:
  sdk: ^3.5.0

dependencies:
  analyzer: ^6.0.0
  build: ^2.4.0
  self_test: ^0.2.0
  source_gen: ^1.5.0

dev_dependencies:
  build_test: ^2.2.0
  lints: ^4.0.0
  test: ^1.25.0
