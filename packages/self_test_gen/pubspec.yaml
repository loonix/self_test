name: self_test_gen
description: "build_runner code generator for self_test. Turns @SelfTestButton and @SelfTestInput annotations into a typed test controller."
version: 0.2.0
repository: https://github.com/loonix/self_test
issue_tracker: https://github.com/loonix/self_test/issues
topics:
  - testing
  - flutter
  - codegen
  - build-runner

# Follows self_test's floor. This package's own code needs nothing newer,
# but it depends on self_test, so declaring an older SDK here only buys a
# consumer a version-solving failure instead of a clear message.
environment:
  sdk: ^3.9.0

# These floors are the oldest versions the tests actually pass against, not
# the oldest that resolve. source_gen 1.5.0 pulls dart_style 2.3.6, which
# predates the tall style and so cannot emit code this repo's formatter
# accepts, and build_test 2.2.x has no testBuilders at all, so the generator's
# own tests do not compile against it. Declaring those versions bought a
# consumer a broken build instead of a clear version-solving message.
dependencies:
  analyzer: '>=7.0.0 <9.0.0'
  build: ^2.4.0
  self_test: ^0.2.0
  source_gen: ^2.0.0

dev_dependencies:
  build_test: ^3.0.0
  # Not imported here. build_test 3.0.0 reaches file 6.0.0, whose File.create
  # does not match the one in Dart 3.13's dart:io, so the test runner does not
  # build with it.
  #
  # Honest limit: `pub downgrade` here still fails to build the test runner,
  # on a transitive package further down that nothing in this pubspec names.
  # The floors below are verified to be NECESSARY (source_gen 1.5.0 pulls a
  # dart_style that cannot emit code this repo's formatter accepts, and
  # build_test 2.2.x has no testBuilders at all) but not verified to be
  # SUFFICIENT for a full downgrade run.
  file: ^7.0.0
  lints: ^4.0.0
  test: ^1.25.9
