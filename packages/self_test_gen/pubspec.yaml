name: self_test_gen
description: "build_runner code generator for self_test. Turns @SelfTestButton and @SelfTestInput annotations into a typed test controller."
version: 0.2.0
repository: https://github.com/loonix/self_test
issue_tracker: https://github.com/loonix/self_test/issues
topics:
  - testing
  - flutter
  - codegen
  - build-runner

# Follows self_test's floor. This package's own code needs nothing newer,
# but it depends on self_test, so declaring an older SDK here only buys a
# consumer a version-solving failure instead of a clear message.
environment:
  sdk: ^3.9.0

# The floor is set by what the generator has to survive, not by what resolves.
#
# analyzer 7 cannot serialise Dart 3.12's dot shorthands: it throws
# "Missing implementation of visitDotShorthandPropertyAccess" while writing
# the summary bundle for any library that reaches the Flutter framework. That
# is every consumer. The result was a generator that ran fine on the declared
# floor (Flutter 3.35, Dart 3.9) and could not run at all on the version CI
# calls current (Flutter 3.47, Dart 3.13), which is the worse half of the
# supported range to be broken on.
#
# The ceilings are wide on purpose. A consumer on Dart 3.9 resolves analyzer
# 10 with source_gen 4.2.4; one on Dart 3.13 resolves analyzer 14 with
# source_gen 4.3.0. Both are verified here: analyze clean, the nine generator
# tests green, and `build_runner build` on the example producing byte-identical
# output under each.
dependencies:
  analyzer: '>=8.1.1 <15.0.0'
  build: '>=3.0.2 <5.0.0'
  self_test: ^0.2.0
  source_gen: ^4.2.4

dev_dependencies:
  # `file` used to be pinned here, unimported, because build_test 3.0.0 reached
  # file 6.0.0 whose File.create did not match Dart 3.13's dart:io. build_test
  # 3.5 reaches file 7 on its own; removed after checking the suite still
  # passes without it on both 3.9 and 3.13.
  build_test: ^3.0.0
  lints: ^4.0.0
  test: ^1.25.9
