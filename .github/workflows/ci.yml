name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going cancels it: nobody
# reads the older result once the newer commit exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The newest version the package is verified against. The floor lives in
  # the matrix below, not here.
  FLUTTER_VERSION: 3.47.2

jobs:
  dart:
    name: Analyze and test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      # Report both legs. Knowing a break is floor-only, or affects both, is
      # most of the diagnosis.
      fail-fast: false
      matrix:
        # Two ends of the supported range, and the lower one is the exact
        # version pubspec.yaml advertises. That pairing is the point: the
        # package claimed >=3.24.0 while using widget properties introduced
        # in 3.35, so every consumer below 3.35 got compile errors inside a
        # package they had just installed, and nothing here would have
        # noticed. Bump the floor here and in pubspec.yaml together.
        flutter: ['3.35.0', '3.47.2']
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true

      # Dependencies are resolved PER PACKAGE. A root `flutter pub get`
      # resolves the root and example only, and every sub-package then reports
      # its imports as unresolved: 38 phantom errors that look like broken
      # code. Do not collapse this into one step.
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          for dir in . example packages/self_test_bridge \
                     packages/self_test_inspector \
                     packages/self_test_devtools_extension; do
            echo "::group::flutter pub get ($dir)"
            (cd "$dir" && flutter pub get)
            echo "::endgroup::"
          done
          echo "::group::dart pub get (packages/self_test_gen)"
          (cd packages/self_test_gen && dart pub get)
          echo "::endgroup::"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Fails the build on any error, and on any warning outside the bridge.
      # The bridge carries 10 pre-existing warnings; they are tracked, not
      # tolerated forever, and this keeps new ones out of everything else.
      - name: Analyze
        run: |
          set -euo pipefail
          dart analyze > analyze.txt 2>&1 || true
          cat analyze.txt
          errors=$(grep -c '^ *error -' analyze.txt || true)
          new_warnings=$(grep '^ *warning -' analyze.txt \
            | grep -vc 'packages/self_test_bridge' || true)
          echo "errors=$errors new_warnings=$new_warnings"
          if [ "$errors" -ne 0 ]; then
            echo "::error::$errors analyzer error(s)"; exit 1
          fi
          if [ "$new_warnings" -ne 0 ]; then
            echo "::error::$new_warnings warning(s) outside packages/self_test_bridge"
            exit 1
          fi

      - name: Test the core
        run: flutter test

      - name: Test the code generator
        run: dart test
        working-directory: packages/self_test_gen

      # The bridge opens a socket into a running app. Its tests are the ones
      # that prove that socket is bound to loopback and needs a token, so a
      # green run here is a security claim, not a formality.
      - name: Test the bridge
        run: flutter test
        working-directory: packages/self_test_bridge

  quickstart:
    name: The README quickstart works end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The documented headline feature was broken for a full release without
      # anyone noticing, in three independent ways at once, because nothing
      # ever ran it. This job runs it.
      - name: Resolve
        run: |
          set -euo pipefail
          flutter pub get
          (cd packages/self_test_gen && dart pub get)
          (cd example && flutter pub get)

      - name: Regenerate the example controller
        working-directory: example
        run: dart run build_runner build --delete-conflicting-outputs

      - name: The generator produced a controller
        working-directory: example
        run: |
          set -euo pipefail
          test -f lib/example.g.dart || {
            echo "::error::build_runner produced no lib/example.g.dart."
            echo "The generator found no annotations. Check that example.dart"
            echo "does not import its own generated file: that makes the"
            echo "library unresolvable and the annotations invisible."
            exit 1
          }
          grep -q 'class ExampleStateTestController' lib/example.g.dart

      # source_gen formats its output with the input library's language
      # version, which lands one notch short of what `dart format` produces
      # for the same file, so the raw output never matches the committed copy
      # byte for byte. Formatting here makes the check about the generator's
      # actual output rather than about whose formatter ran last.
      - name: Format the regenerated file
        run: dart format example/lib/example.g.dart

      # Committed generated code that no longer matches its source is worse
      # than none: it compiles, so nothing complains, and it lies.
      - name: Committed generated code is up to date
        run: git diff --exit-code -- example/lib/example.g.dart

      - name: Drive the app through the generated controller
        working-directory: example
        run: flutter test

  mcp:
    name: Build the MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/self_test_mcp/package-lock.json

      # --ignore-scripts skips the postinstall, which downloads a Chromium
      # for Playwright. CI only builds the server here, so that is a browser
      # download and a couple of minutes bought for nothing.
      - name: Install
        working-directory: packages/self_test_mcp
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: packages/self_test_mcp
        run: npm run build

  devtools:
    name: The DevTools panel builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # devtools_extensions 0.1.x passed --web-renderer to `flutter build web`,
      # which no longer exists, so the panel could not be built at all against
      # either supported Flutter version. Nothing noticed, because nothing
      # built it. This does.
      - name: Build the panel
        working-directory: packages/self_test_devtools_extension
        run: |
          set -euo pipefail
          flutter pub get
          dart run devtools_extensions build_and_copy \
            --source=. --dest=../../extension/devtools

  pana:
    name: pub.dev score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Score the core package
        run: |
          set -euo pipefail
          flutter pub get
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .
